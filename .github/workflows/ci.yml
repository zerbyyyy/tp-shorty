name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: secretpassword
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: shorty
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Démarre la base exactement selon la consigne du sujet
      - name: Start Database
        run: docker compose -f compose.yaml up -d --wait db

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      # Récupère l'IP du conteneur ou passe par localhost si mappé
      - name: Run Tests
        working-directory: api
        run: |
          npm ci
          # Récupère dynamiquement l'IP du conteneur db dans le réseau Docker
          DB_HOST=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker compose -f ../compose.yaml ps -q db))
          # Si vide (ex: network_mode host), on bascule sur 127.0.0.1
          DB_HOST=${DB_HOST:-127.0.0.1}
          DATABASE_URL="postgres://postgres:secretpassword@${DB_HOST}:5432/shorty" npm test

      - name: Build Images
        run: docker compose -f compose.yaml build

      - name: Scan API Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ vars.DOCKERHUB_USERNAME }}/shorty-api:${{ env.TAG }}

      - name: Scan Front Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ vars.DOCKERHUB_USERNAME }}/shorty-front:${{ env.TAG }}

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Images
        run: docker compose push api front