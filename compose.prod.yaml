services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shorty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shorty}"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME}/shorty-api:${TAG:?Variable TAG manquante}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-shorty}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back
      - front

  front:
    image: ${DOCKERHUB_USERNAME}/shorty-front:${TAG:?Variable TAG manquante}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "80:8080"
    depends_on:
      - api
    networks:
      - front

networks:
  front:
  back:

volumes:
  db-data:

secrets:
  db_password:
    environment: DB_PASSWORD